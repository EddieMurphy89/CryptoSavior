<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>密码编码系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('img/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 确保内容在遮罩上方 */
        }
        h1 {
            text-align: center;
            margin: 100px 0 110px; /* 增加底部间距 */
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            width: 200px;
            height: 150px;
            perspective: 1000px;
        }
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .card:hover .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease;
        }
        .card:hover .card-front, .card:hover .card-back {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2), 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-front.symmetric {
            background-color: #6f42c1; /* 紫色 */
        }
        .card-front.hash {
            background-color: #ffc107; /* 黄色 */
        }
        .card-front.encoding {
            background-color: #28a745; /* 绿色 */
        }
        .card-front.publickey {
            background-color: #dc3545; /* 红色 */
        }

        .card-back.symmetric {
            background-color: #6f42c1; /* 紫色 */
            transform: rotateY(180deg);
        }
        .card-back.hash {
            background-color: #ffc107; /* 黄色 */
            transform: rotateY(180deg);
        }
        .card-back.encoding {
            background-color: #28a745; /* 绿色 */
            transform: rotateY(180deg);
        }
        .card-back.publickey {
            background-color: #dc3545; /* 红色 */
            transform: rotateY(180deg);
        }

        a {
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>
<h1>CryptoSavior -- 基于Golang开发的通用密码学加解密服务站点</h1>
<div class="container">
    <div class="card">
        <div class="card-inner">
            <div class="card-front symmetric">对称密码算法</div>
            <div class="card-back symmetric"><a href="/symmetric">点击进入</a></div>
        </div>
    </div>
    <div class="card">
        <div class="card-inner">
            <div class="card-front hash">哈希密码算法</div>
            <div class="card-back hash"><a href="/hash">点击进入</a></div>
        </div>
    </div>
    <div class="card">
        <div class="card-inner">
            <div class="card-front encoding">常用编码算法</div>
            <div class="card-back encoding"><a href="/encoding">点击进入</a></div>
        </div>
    </div>
    <div class="card">
        <div class="card-inner">
            <div class="card-front publickey">公钥密码算法</div>
            <div class="card-back publickey"><a href="/publickey">点击进入</a></div>
        </div>
    </div>
</div>
<footer style="position: absolute; bottom: 10px; width: 100%; text-align: center; color: black;">
    <b>Copyright@bupt.罗宇航</b>
</footer>
</body>
</html>
