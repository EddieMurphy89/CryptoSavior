<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编码工具</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f7e5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 20px;
      color: #333;
    }

    form {
      margin-bottom: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 20px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
      line-height: 1.5;
      resize: none;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #0056b3;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }

    .hidden {
      display: none;
    }
  </style>
  <script>
    function showEncodingForm() {
      const selectedEncoding = document.getElementById("encoding").value;
      const forms = ["base32Form", "base58Form", "base64Form", "hexForm", "rot13Form", "unicodeForm", "urlForm", "utf8Form", "hex4base64Form"];
      forms.forEach(form => {
        document.getElementById(form).classList.add("hidden");
      });
      if (selectedEncoding) {
        document.getElementById(selectedEncoding + "Form").classList.remove("hidden");
      }
    }
  </script>
</head>
<body>
<div style="position: absolute; top: 10px; left: 10px;">
  <a href="/" style="text-decoration: none; color: #007bff; font-size: 14px;">BACK</a>
</div>
<h1>编码工具</h1>

<!-- 编码选择表单 -->
<form action="/encoding" method="post">
  <label for="encoding">选择编码类型:</label>
  <select name="encoding" id="encoding" onchange="showEncodingForm()">
    <option value="" selected disabled>请选择编码类型</option>
    <option value="base32">Base32</option>
    <option value="base58">Base58</option>
    <option value="base64">Base64</option>
    <option value="hex">Hex</option>
    <option value="rot13">ROT13</option>
    <option value="unicode">Unicode</option>
    <option value="url">URL</option>
    <option value="utf8">UTF-8</option>
    <option value="hex4base64">Base64/Hex</option> <!-- 添加此选项 -->
  </select>
</form>

<hr>

<!-- Base32 编码工具 -->
<div class="container hidden" id="base32Form">
  <h2>Base32 编码工具</h2>
  <form action="/base32" method="post">
    <label for="base32Text">输入文本:</label>
    <textarea id="base32Text" name="text"></textarea>
    <label for="base32Action">操作:</label>
    <select name="action" id="base32Action">
      <option value="encrypt">加密</option>
      <option value="decrypt">解密</option>
    </select>
    <button type="submit">提交</button>
  </form>
</div>

<footer style="position: absolute; bottom: 10px; width: 100%; text-align: center; color: black;">
